<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<link
			rel="stylesheet"
			href="style.css"
		/>
		<script
			src="script.js"
			defer
		></script>
		<title>Slider</title>
	</head>
	<body>
		<section class="slider">
			<div class="slider__inner">
				<div class="slider__container">
					<button class="slider__slides-btn prev">-</button>
					<div class="slider__slides">
						<img
							src="./slides/slide-1.jpg"
							alt=""
							class="img__slides"
						/>
						<img
							src="./slides/slide-2.jpg"
							alt=""
							class="img__slides"
						/>
						<img
							src="./slides/slide-3.jpg"
							alt=""
							class="img__slides"
						/>
					</div>
					<button class="slider__slides-btn next">+</button>
				</div>
			</div>
		</section>
	</body>
</html>
